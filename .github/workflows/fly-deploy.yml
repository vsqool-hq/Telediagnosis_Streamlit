name: Deploy backend to Fly.io

# Uruchamiane RĘCZNIE z przeglądarki: zakładka Actions → „Deploy backend to Fly.io"
# → „Run workflow". Świadomie bez automatu na każdy push, żeby deploy nie ubił
# trwającego rozliczenia. (Można później dodać `push:` na gałąź main.)
on:
  workflow_dispatch:

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    concurrency: deploy-fly   # nie pozwól na dwa równoległe deploye
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
